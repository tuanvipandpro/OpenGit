[package]
name = "opengit"
version = "0.2.0"
description = "OpenGit desktop client"
edition = "2021"
rust-version = "1.99.1"

[lib]
name = "opengit_lib"
crate-type = ["lib"]

[[bin]]
name = "opengit"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
e2e = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-build"]

[build-dependencies]
tauri-build = { version = "=2.7.4", optional = true, features = [] }

[dependencies]
tauri = { version = "=2.12.5", optional = true, features = [] }
tauri-plugin-dialog = { version = "=2.8.3", optional = true }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "net"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
uuid = { version = "=1.29.0", features = ["v4", "serde"] }
thiserror = "=2.0.21"
zeroize = "=1.9.1"
url = "=2.5.8"
notify = "=8.2.0"
chrono = { version = "=0.4.45", features = ["clock", "std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Diagnostics_ToolHelp"] }

[dev-dependencies]
tempfile = "=3.27.0"
